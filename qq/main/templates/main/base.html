<!DOCTYPE html>
<html>
<head>
    <title>Простая аутентификация</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .nav { background: #eee; padding: 10px; margin-bottom: 20px; }
        .nav a { margin-right: 15px; text-decoration: none; }
        .message { padding: 10px; margin: 10px 0; }
        .success { background: #d4ffd4; }
        .error { background: #ffd4d4; }
        input { display: block; margin: 10px 0; padding: 8px; width: 200px; }
        button { padding: 10px 20px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">Главная</a>
        {% if user.is_authenticated %}
            <span>Привет, {{ user.username }}!</span>
            <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </div>

    {% for message in messages %}
        <div class="message {{ message.tags }}">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
</body>
</html>
